<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article — Hafez Fandy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111111;
    --bg2: #1a1a1a;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --accent: #D85A30;
    --text: #E8E6E0;
    --muted: #888780;
    --muted2: #5a5855;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 1000; opacity: 0.4;
  }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.2rem 4rem;
    background: rgba(17,17,17,0.92); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; color: var(--text); text-decoration: none; letter-spacing: -0.02em; }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
  .nav-links a:hover { color: var(--text); }
  .nav-links a.active { color: var(--accent); }

  .article-wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 8rem 2rem 6rem;
  }

  .back-link {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); text-decoration: none;
    transition: color 0.2s; margin-bottom: 3rem;
  }
  .back-link:hover { color: var(--accent); }

  .article-category {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--accent); font-weight: 500; margin-bottom: 1rem; display: block;
  }

  .article-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 900; line-height: 1.15; letter-spacing: -0.02em;
    color: var(--text); margin-bottom: 1.2rem;
  }

  .article-meta-row {
    display: flex; align-items: center; gap: 1.5rem;
    padding: 1.2rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    margin-bottom: 2.5rem;
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted2);
  }

  .article-cover {
    width: 100%; max-height: 480px; object-fit: cover;
    display: block; margin-bottom: 2.5rem; filter: grayscale(10%);
    border: 1px solid var(--border);
  }

  .article-cover-ph {
    width: 100%; height: 380px; background: var(--bg2);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted2); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 2.5rem; border: 1px solid var(--border);
  }

  /* ARTICLE BODY TYPOGRAPHY */
  .article-body {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    line-height: 1.85;
    color: #D4D1CB;
    letter-spacing: 0.01em;
  }

  .article-body p { margin-bottom: 1.6rem; }
  .article-body h2 { font-size: 1.5rem; font-weight: 700; color: var(--text); margin: 2.5rem 0 1rem; letter-spacing: -0.01em; }
  .article-body h3 { font-size: 1.2rem; font-weight: 600; color: var(--text); margin: 2rem 0 0.8rem; }
  .article-body ul, .article-body ol { margin: 0 0 1.6rem 1.5rem; }
  .article-body li { margin-bottom: 0.5rem; }
  .article-body blockquote {
    border-left: 3px solid var(--accent);
    padding: 0.5rem 0 0.5rem 1.5rem;
    margin: 2rem 0;
    font-style: italic;
    color: var(--muted);
  }
  .article-body a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .article-body code {
    font-family: monospace; font-size: 0.88em;
    background: var(--bg2); padding: 0.15em 0.4em;
    border-radius: 3px; color: var(--accent);
  }
  .article-body pre {
    background: var(--bg2); border: 1px solid var(--border);
    padding: 1.2rem; border-radius: 6px; overflow-x: auto;
    margin-bottom: 1.6rem;
  }
  .article-body pre code { background: none; padding: 0; }

  /* DIVIDER */
  .article-end {
    display: flex; align-items: center; gap: 1rem;
    margin: 3rem 0; justify-content: center;
  }
  .article-end::before, .article-end::after { content: ''; height: 1px; width: 80px; background: var(--border-strong); }
  .article-end-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  .back-bottom {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); text-decoration: none; transition: color 0.2s;
  }
  .back-bottom:hover { color: var(--accent); }

  footer { padding: 2rem 4rem; border-top: 1px solid var(--border); text-align: center; color: var(--muted); font-size: 0.82rem; }

  @media (max-width: 900px) { nav { padding: 1rem 1.5rem; } .nav-links { gap: 1.2rem; } }
  @media (max-width: 600px) {
    nav { padding: 0.9rem 1rem; }
    .nav-links { display: none; }
    .article-wrap { padding: 6rem 1rem 4rem; }
    .article-body { font-size: 1rem; }
    footer { padding: 1.5rem 1rem; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">HF<span>.</span></a>
  <ul class="nav-links">
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#skills">Skills</a></li>
    <li><a href="index.html#projects">Projects</a></li>
    <li><a href="lab.html">Lab</a></li>
    <li><a href="blog.html" class="active">Blog</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>

<div class="article-wrap" id="articleWrap">
  <a href="blog.html" class="back-link">← Back to Journal</a>
  <div id="articleContent">
    <p style="color:var(--muted); font-family:'Playfair Display',serif; font-style:italic;">Loading article...</p>
  </div>
</div>

<footer>
  <p>© 2026 Hafez Fandy — WordPress & Front-End Developer</p>
</footer>

<script>
  function getArticles() {
    try { return JSON.parse(localStorage.getItem('hf_articles')) || []; } catch(e) { return []; }
  }

  function renderArticle() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const articles = getArticles();
    const a = articles.find(x => x.id === id);
    const container = document.getElementById('articleContent');

    if (!a) {
      container.innerHTML = `
        <p style="color:var(--muted);font-family:'Playfair Display',serif;font-style:italic;">
          Article not found. It may have been deleted.
        </p>
        <br>
        <a href="blog.html" class="back-bottom">← Back to Journal</a>`;
      return;
    }

    document.title = a.title + ' — Hafez Fandy';

    const imgHTML = a.image
      ? `<img class="article-cover" src="${a.image}" alt="${a.title}" onerror="this.outerHTML='<div class=\\'article-cover-ph\\'>Image</div>'">`
      : `<div class="article-cover-ph">Cover Image</div>`;

    // Convert plain text body to paragraphs, preserve manual line breaks
    const bodyHTML = a.body
      ? a.body.split(/\n\n+/).map(p => p.trim() ? `<p>${p.replace(/\n/g,'<br>')}</p>` : '').join('')
      : '<p style="color:var(--muted);font-style:italic;">No content.</p>';

    container.innerHTML = `
      <span class="article-category">${a.category}</span>
      <h1 class="article-title">${a.title}</h1>
      <div class="article-meta-row">
        <span>${a.date}</span>
        <span>By Hafez Fandy</span>
      </div>
      ${imgHTML}
      <div class="article-body">${bodyHTML}</div>
      <div class="article-end"><div class="article-end-dot"></div></div>
      <a href="blog.html" class="back-bottom">← Back to Journal</a>
    `;
  }

  renderArticle();
</script>
</body>
</html>
