<style>
  :root {
    --bg: #0a0a0a;
    --bg2: #161616;
    --border: rgba(255,255,255,0.12);
    --border-strong: rgba(255,255,255,0.2);
    --accent: #ffffff;
    --text: #f5f5f3;
    --muted: #8a8a8a;
    --muted2: #6b6b6b;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 1000; opacity: 0.4;
  }
  nav {
    position: fixed;
    top: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    width: max-content;
    max-width: calc(100% - 2rem);
    padding: 0.9rem 2.2rem;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px;
  }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a {
    position: relative;
    display: inline-block;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
    transition: color 0.2s;
    letter-spacing: 0.02em;
    padding-bottom: 4px;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 1px;
    background: var(--text);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.3s ease;
  }
  .nav-links a:hover { color: var(--text); }
  .nav-links a:hover::after { transform: scaleX(1); transform-origin: left; }
  .nav-links a.active { color: var(--text); }
  .nav-links a.active::after { transform: scaleX(1); }

  .article-wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 8rem 2rem 6rem;
  }

  .back-link {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); text-decoration: none;
    transition: color 0.2s; margin-bottom: 3rem;
  }
  .back-link:hover { color: var(--accent); }

  .article-category {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--accent); font-weight: 500; margin-bottom: 1rem; display: block;
  }

  .article-title {
    font-family: 'Sora', sans-serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 900; line-height: 1.15; letter-spacing: -0.02em;
    color: var(--text); margin-bottom: 1.2rem;
  }

  .article-meta-row {
    display: flex; align-items: center; gap: 1.5rem;
    padding: 1.2rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    margin-bottom: 2.5rem;
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted2);
  }

  .article-cover {
    width: 100%; max-height: 480px; object-fit: cover;
    display: block; margin-bottom: 2.5rem; filter: grayscale(10%);
    border: 1px solid var(--border);
  }

  .article-cover-ph {
    width: 100%; height: 380px; background: var(--bg2);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted2); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 2.5rem; border: 1px solid var(--border);
  }

  /* ARTICLE BODY TYPOGRAPHY */
  .article-body {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.15rem;
    line-height: 1.85;
    color: #D4D1CB;
    letter-spacing: 0.01em;
  }

  .article-body p { margin-bottom: 1.6rem; }
  .article-body h2 { font-size: 1.5rem; font-weight: 700; color: var(--text); margin: 2.5rem 0 1rem; letter-spacing: -0.01em; }
  .article-body h3 { font-size: 1.2rem; font-weight: 600; color: var(--text); margin: 2rem 0 0.8rem; }
  .article-body ul, .article-body ol { margin: 0 0 1.6rem 1.5rem; }
  .article-body li { margin-bottom: 0.5rem; }
  .article-body blockquote {
    border-left: 3px solid var(--accent);
    padding: 0.5rem 0 0.5rem 1.5rem;
    margin: 2rem 0;
    font-style: italic;
    color: var(--muted);
  }
  .article-body a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .article-body code {
    font-family: monospace; font-size: 0.88em;
    background: var(--bg2); padding: 0.15em 0.4em;
    border-radius: 3px; color: var(--accent);
  }
  .article-body pre {
    background: var(--bg2); border: 1px solid var(--border);
    padding: 1.2rem; border-radius: 6px; overflow-x: auto;
    margin-bottom: 1.6rem;
  }
  .article-body pre code { background: none; padding: 0; }

  /* DIVIDER */
  .article-end {
    display: flex; align-items: center; gap: 1rem;
    margin: 3rem 0; justify-content: center;
  }
  .article-end::before, .article-end::after { content: ''; height: 1px; width: 80px; background: var(--border-strong); }
  .article-end-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  .back-bottom {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); text-decoration: none; transition: color 0.2s;
  }
  .back-bottom:hover { color: var(--accent); }

  footer { padding: 2rem 4rem; text-align: center; color: var(--muted); font-size: 0.82rem; }

  .footer-resume {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.9rem;
    color: var(--text);
    text-decoration: none;
    font-size: 0.82rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 2px;
    transition: color 0.2s, border-color 0.2s;
  }
  .footer-resume:hover { color: #fff; border-color: rgba(255,255,255,0.5); }
  .footer-resume svg { width: 14px; height: 14px; }

  .whatsapp-float {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #25D366;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 30px rgba(37,211,102,0.35);
    z-index: 90;
    opacity: 0;
    transform: translateY(24px) scale(0.85);
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease, background 0.2s;
  }
  .whatsapp-float.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .whatsapp-float:hover { background: #20BD5A; transform: translateY(-3px) scale(1.05); }
  .whatsapp-float svg { width: 28px; height: 28px; fill: #fff; }
  @media (max-width: 768px) {
    .whatsapp-float { bottom: 1.2rem; right: 1.2rem; width: 50px; height: 50px; }
    .whatsapp-float svg { width: 25px; height: 25px; }
  }

  @media (max-width: 900px) { nav { padding: 1rem 1.5rem; } .nav-links { gap: 1.2rem; } }
  @media (max-width: 600px) {
    nav { padding: 0.9rem 1rem; }
    .nav-links { display: none; }
    .article-wrap { padding: 6rem 1rem 4rem; }
    .article-body { font-size: 1rem; }
    footer { padding: 1.5rem 1rem; }
  }
</style>
</head>
<body>

<script>

  function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function inline(t){
    return t
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g,'<em>$1</em>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  function parseFrontmatter(raw){
    var meta={}, m=raw.match(/^---([\s\S]*?)---/);
    if(m){m[1].trim().split('\n').forEach(function(l){
      var i=l.indexOf(':');
      if(i>-1){meta[l.slice(0,i).trim()]=l.slice(i+1).trim().replace(/^["']|["']$/g,'');}
    });}
    return meta;
  }

  function parseMarkdown(raw){
    var md=raw.replace(/^---[\s\S]*?---\n?/,'');
    var lines=md.split('\n'),html='',inUl=false,inOl=false,inCode=false,buf='';
    for(var i=0;i<lines.length;i++){
      var l=lines[i];
      if(l.indexOf('```')===0){
        if(!inCode){inCode=true;buf='';if(inUl){html+='</ul>';inUl=false;}if(inOl){html+='</ol>';inOl=false;}}
        else{inCode=false;html+='<pre><code>'+escHtml(buf.trim())+'</code></pre>';}
        continue;
      }
      if(inCode){buf+=l+'\n';continue;}
      if(!/^[*-] /.test(l)&&inUl){html+='</ul>';inUl=false;}
      if(!/^\d+\. /.test(l)&&inOl){html+='</ol>';inOl=false;}
      if(l.indexOf('# ')===0){html+='<h1>'+inline(l.slice(2))+'</h1>';}
      else if(l.indexOf('## ')===0){html+='<h2>'+inline(l.slice(3))+'</h2>';}
      else if(l.indexOf('### ')===0){html+='<h3>'+inline(l.slice(4))+'</h3>';}
      else if(l.indexOf('> ')===0){html+='<blockquote>'+inline(l.slice(2))+'</blockquote>';}
      else if(/^---+$/.test(l)){html+='<hr>';}
      else if(/^[*-] /.test(l)){if(!inUl){html+='<ul>';inUl=true;}html+='<li>'+inline(l.slice(2))+'</li>';}
      else if(/^\d+\. /.test(l)){if(!inOl){html+='<ol>';inOl=true;}html+='<li>'+inline(l.replace(/^\d+\. /,''))+'</li>';}
      else if(l.trim()===''){html+='';}
      else{html+='<p>'+inline(l)+'</p>';}
    }
    if(inUl)html+='</ul>';if(inOl)html+='</ol>';
    return html;
  }

  var params=new URLSearchParams(window.location.search);
  var slug=params.get('slug');
  var container=document.getElementById('articleContent');

  if(!slug){
    container.innerHTML='<p style="color:var(--muted);font-style:italic;">No article specified.</p><br><a href="blog.html" class="back-bottom">&larr; Back to Journal</a>';
  } else {
    fetch('posts/'+slug+'.txt')
      .then(function(r){if(!r.ok)throw new Error('not found');return r.text();})
      .then(function(raw){
        var meta=parseFrontmatter(raw);
        var body=parseMarkdown(raw);
        document.title=(meta.title||'Article')+' \u2014 Hafez Fandy';
        var img=meta.image?'<img class="article-cover" src="'+meta.image+'" alt="'+( meta.title||'')+'">'  :'';
        container.innerHTML=
          '<span class="article-category">'+(meta.category||'')+'</span>'+
          '<h1 class="article-title">'+(meta.title||'')+'</h1>'+
          '<div class="article-meta-row"><span>'+(meta.date||'')+'</span><span>By Hafez Fandy</span></div>'+
          img+
          '<div class="article-body">'+body+'</div>'+
          '<div class="article-end"><div class="article-end-dot"></div></div>'+
          '<a href="blog.html" class="back-bottom">&larr; Back to Journal</a>';
      })
      .catch(function(){
        container.innerHTML='<p style="color:var(--muted);font-style:italic;">Article not found.</p><br><a href="blog.html" class="back-bottom">&larr; Back to Journal</a>';
      });
  }
</script>

<script>
  (function() {
    var waBtn = document.getElementById('whatsappFloat');
    var revealAt = window.innerHeight * 0.6;
    var ticking = false;
    function toggleButton() {
      if (window.scrollY > revealAt) { waBtn.classList.add('visible'); }
      else { waBtn.classList.remove('visible'); }
      ticking = false;
    }
    window.addEventListener('scroll', function() {
      if (!ticking) { requestAnimationFrame(toggleButton); ticking = true; }
    });
    toggleButton();
  })();
</script>
